# OceanSentinel configuration
# Copy to config.toml and edit. Every section is optional.
# Secrets: put GFW_API_TOKEN in a .env file or the environment, never here.

[server]
host = "127.0.0.1"
port = 8787
open_browser = true
# Set this before binding to anything but loopback: every API and WebSocket
# request then needs it (the UI asks for it once and remembers). OS_API_TOKEN
# in the environment overrides it.
# api_token = "change-me"

# Where persistent state lives: zones.json, watchlist.json, alerts.jsonl,
# history/ (track recording) and the daily log file.
[storage]
dir = "data"
record_tracks = false       # enables the replay scrubber; costs disk
record_interval_s = 300     # one sample per vessel per interval
retention_days = 3

# Out-of-band alert delivery. Empty = alerts stay in the UI.
[alerts]
webhooks = []               # JSON POST {text, content, alert} — Slack/Discord/Teams/Zapier/n8n
# telegram_bot_token = ""
# telegram_chat_id = ""
min_severity = "medium"     # info | medium | high
max_per_minute = 30         # flood guard across all destinations

# Vessels to alert on the moment they appear. Entries added from the UI are
# appended to data/watchlist.json instead.
[watchlist]
# entries = [
#   { mmsi = 664123000, note = "sanctioned" },
#   { imo = 9123456, name = "EXAMPLE", note = "IUU-listed" },
# ]

# Area of interest = where the map opens (and where the demo traffic appears)
[aoi]
name = "Strait of Gibraltar"
center_lat = 36.02
center_lon = -5.36
zoom = 9.0

# Built-in traffic generator so the app is useful with zero hardware.
# Turn off once you attach real feeds.
[simulation]
enabled = true
vessels = 14          # AIS-transmitting targets
dark_vessels = 5      # no-AIS targets (detected only by sonar/lidar -> dark contact alerts)
interval_ms = 1000
sonar_range_km = 16.0
lidar_range_km = 4.0

[fusion]
gate_m = 900.0             # association gate: sensor contact within this range joins a track
dark_alert_after_s = 25    # sensor-only track age before a "dark contact" alert is raised
ais_lost_after_s = 180     # AIS track silent this long -> "AIS lost" alert
stale_after_s = 120        # UI greys out tracks not seen for this long
drop_after_s = 1800        # forget tracks not seen for this long
alert_cooldown_s = 600     # minimum seconds between repeated alerts for the same track
trail_points = 400         # trail history kept per track
snapshot_trail = 90        # trail points streamed to the map per update
tick_ms = 1000             # fusion/telemetry tick
max_tracks = 2500          # hard cap for global feeds (least recently seen evicted)
collision_cpa_m = 500.0    # TTM targets closer than this (with TCPA below) raise a risk alert
collision_tcpa_min = 10.0
feed_stall_after_s = 90    # connected feed silent this long -> "FEED SILENT" alert

# --- Live feeds -------------------------------------------------------------
# AIS: best fed by an RTL-SDR running AIS-catcher (free, open source):
#   AIS-catcher -d 0 -o 5 127.0.0.1 10110        # raw NMEA over TCP
#   AIS-catcher -d 0 -o 3 127.0.0.1 10111        # raw NMEA over UDP
# Both raw NMEA (!AIVDM) and AIS-catcher JSON lines are accepted.
[sources.ais]
enabled = false
tcp = ["127.0.0.1:10110"]
udp = []

# Sonar / radar / ARPA target trackers: NMEA 0183 TLL (target lat/lon) and
# TTM (target range/bearing relative to own ship) sentences.
# Talkers: SD/SN = sonar, RA = radar/ARPA, LI = lidar tracker.
[sources.sonar]
enabled = false
udp = ["0.0.0.0:10112"]
tcp = []
talkers = ["SD", "SN", "RA", "LI"]

# Marine LiDAR: contact-level JSON lines over UDP (schema in README).
[sources.lidar]
enabled = false
udp = ["0.0.0.0:10113"]
tcp = []
talkers = ["LI"]

# Global live AIS over the internet, via AISStream.io (free API key:
# https://aisstream.io). Put AISSTREAM_API_KEY in .env. Defaults to the whole
# globe — narrow the boxes to cut message volume: [[[south, west], [north, east]]].
[sources.aisstream]
enabled = false
url = "wss://stream.aisstream.io/v0/stream"
bounding_boxes = [[[-90.0, -180.0], [90.0, 180.0]]]

[gfw]
# Global Fishing Watch enrichment. Get a free token at
# https://globalfishingwatch.org/our-apis/tokens (non-commercial use).
# Then set GFW_API_TOKEN in the environment or .env.
enabled = true
base_url = "https://gateway.api.globalfishingwatch.org"
cache_ttl_s = 21600

# =============================================================================
# Project Icarus — the aerospace domain (ADS-B aircraft), served at /icarus
# =============================================================================
# Aircraft broadcast identity, position and intent in the clear on 1090 MHz;
# a volunteer receiver network republishes that picture as JSON. The default
# provider needs no API key at all.
#
# Coverage is receiver-bound, exactly like AIS: dense over Europe and North
# America, thin over Africa and South Asia. The one global exception is the
# military sweep below, which returns every military and government aircraft
# the network can hear worldwide in a single request — that is what a
# world-zoom view shows.
[icarus]
enabled = true
# adsb.lol speaks the ADSBexchange v2 schema and needs no key. Note that
# airplanes.live serves the same schema but returns HTTP 403 to unregistered
# clients ("contact us at contact@airplanes.live"), so it is not a drop-in.
base_url = "https://api.adsb.lol"

# ---- the request budget ----------------------------------------------------
# The public feed is free and keyless, and it is NOT unlimited. Measured
# against api.adsb.lol: roughly one request every 15 s is sustainable
# indefinitely, while a burst of ~5 in 20 s gets the client blocked (HTTP 429).
# Everything below is about spending that budget well, and the client also
# self-corrects: a 429 puts it into an exponentially growing hold-off that
# halves again on every success.
#
# Sweep cadence: each tick issues at most `queries_per_tick` circles out of the
# grid covering your viewport, rotating, so the grid refreshes over several
# ticks. A tick that cannot afford a request is skipped rather than blocked, so
# the API and the WebSocket stay responsive.
poll_ms = 8000
queries_per_tick = 1
# Radius of one query, nautical miles (provider maximum is 250). Larger radius
# beats more circles when requests are the scarce resource.
radius_nm = 250
# Hard ceiling on circles per sweep. Wide views beyond this switch to the
# global military sweep instead of pretending to cover a continent.
max_circles = 4
# Minimum spacing between two requests, so a viewport drag cannot machine-gun
# the provider.
min_request_gap_ms = 2500
# Burst allowance: at most this many requests per `burst_window_s`.
burst_requests = 2
burst_window_s = 40

# Where the air map looks when no browser has it open (alerts keep flowing).
# Default is the busiest ADS-B airspace on earth. Point it at your local
# airport for a quieter, more personal picture.
home_lat = 51.47
home_lon = -0.45
home_zoom = 8.0

max_tracks = 4000
# Flight trails: aircraft cover ground fast, so points are dropped in at ~900 m
# or 15 s and the tail is kept short.
trail_points = 60

# Detection thresholds. "Lost contact" is the dark-vessel analogue and is *not*
# proof of anything on its own: transponder range is line-of-sight, so an
# aircraft leaving receiver range looks exactly like one switching off.
# The effective threshold is stretched automatically when a slow sweep needs
# longer than this to revisit an area, so rotation never fakes an alert.
lost_contact_s = 300
drop_after_s = 1800

# Every military / government aircraft the network hears, worldwide, in one
# request. Cheap (once a minute) and the only genuinely global layer available
# without a paid feed.
global_mil = true
mil_interval_s = 90

# Alerts. Emergency squawks (7500/7600/7700) are on by default; military by
# default is off because it fires a lot in some regions.
alert_emergency = true
alert_military = false
alert_lost = true
alert_watchlist = true
alert_cooldown_s = 600
# Escalations (lifeguard -> 7700) break through the cooldown; repeats do not.

# Archive aircraft positions to data/icarus/history/<day>.jsonl
record = false
record_interval_s = 300

# Optional OpenSky Network provider: the only source here that answers a global
# query for *civil* traffic. Needs a free account; set OPENSKY_CLIENT_ID and
# OPENSKY_CLIENT_SECRET in .env, then turn this on.
opensky = false

# Watchlist from config (the UI adds more; both are merged and persisted to
# data/icarus/watchlist.json). Match on any of hex / callsign / registration.
# [[icarus.watch]]
# hex = "ae5667"                  # ICAO 24-bit address, lowercase
# callsign = "RCH123"             # as broadcast, no spaces
# registration = "G-EZUC"         # tail number
# note = "government flight"
